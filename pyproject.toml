[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "editpy-ide"
version = "0.5.0"
description = "A focused, cross-platform Python IDE, designed first for macOS"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "jedi>=0.19,<0.21", "ruff>=0.14,<1", "pyte>=0.8.2,<0.9", "Pygments>=2.19,<3", "pywinpty>=3.0.3,<4; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
editpy = "editpy.__main__:main"

[tool.setuptools.packages.find]
include = ["editpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
editpy = ["assets/*.svg"]
