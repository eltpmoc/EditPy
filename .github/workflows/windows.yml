name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check source
        run: python -m ruff check editpy tests scripts examples
      - name: Test Windows and shared components
        run: python -m pytest -q -o faulthandler_timeout=45
      - name: Build and verify Windows executable
        run: python scripts/build_windows.py
      - name: Upload executable and validation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: EditPy-Windows-x64
          path: |
            dist/*Windows-x64.zip
            dist/*.sha256
            build/windows-package-smoke.json
            build/windows-package-smoke.png
          if-no-files-found: warn
          retention-days: 30
